[project]
name = "axs-hasher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alessio Saltarin", email = "alessiosaltarin@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.4",
    "pyperclip>=1.11.0",
    "questionary>=2.1.1",
]

[project.scripts]
axs-hasher = "axs_hasher:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint>=4.1.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[tool.pylint.main]
source-roots = ["src"]
